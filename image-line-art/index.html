<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Line Art Effect - ToolSarthi</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h1{
    margin-bottom:10px;
}

p{
    color:#666;
}

input[type="file"]{
    margin:20px 0;
}

canvas{
    max-width:100%;
    margin:15px 0;
    border-radius:10px;
    background:white;
}

.controls{
    margin:15px 0;
}

input[type="range"]{
    width:80%;
}

button{
    padding:12px 18px;
    margin:6px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#222;
    color:white;
    font-size:15px;
}

button:hover{
    opacity:0.85;
}
</style>
</head>

<body>

<div class="container">

<h1>🖊️ Image Line Art Effect</h1>

<p>Turn your photos into clean black outline line-art images.</p>

<input type="file" id="upload" accept="image/*">

<div class="controls">
<label>
Line Strength:
<strong><span id="strengthValue">60</span></strong>
</label>
<br><br>
<input type="range" id="strength" min="10" max="100" value="60">
</div>

<canvas id="canvas"></canvas>

<br>

<button onclick="applyLineArt()">Apply Line Art</button>
<button onclick="resetImage()">Reset</button>
<button onclick="downloadImage()">Download Image</button>

</div>

<script>

const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const strengthSlider = document.getElementById("strength");
const strengthValue = document.getElementById("strengthValue");

let originalImage = null;

strengthSlider.addEventListener("input", function(){
    strengthValue.textContent = this.value;
});

upload.addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    const img = new Image();

    img.onload = function(){

        originalImage = img;

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img,0,0);

    };

    img.src = URL.createObjectURL(file);

});

function applyLineArt(){

    if(!originalImage){
        alert("Please upload an image first.");
        return;
    }

    ctx.drawImage(originalImage,0,0);

    const imageData = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const data = imageData.data;

    const width = canvas.width;
    const height = canvas.height;

    const gray = new Uint8ClampedArray(width * height);

    for(let y = 0; y < height; y++){

        for(let x = 0; x < width; x++){

            const i = (y * width + x) * 4;

            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            gray[y * width + x] =
                0.299 * r +
                0.587 * g +
                0.114 * b;
        }
    }

    const output = new Uint8ClampedArray(data);

    const strength = Number(strengthSlider.value);

    for(let y = 1; y < height - 1; y++){

        for(let x = 1; x < width - 1; x++){

            const center = gray[y * width + x];

            const right = gray[y * width + (x + 1)];
            const bottom = gray[(y + 1) * width + x];

            const edge =
                Math.abs(center - right) +
                Math.abs(center - bottom);

            const threshold = 100 - strength;

            const value = edge > threshold ? 0 : 255;

            const i = (y * width + x) * 4;

            output[i] = value;
            output[i + 1] = value;
            output[i + 2] = value;
            output[i + 3] = 255;
        }
    }

    const result = new ImageData(
        output,
        width,
        height
    );

    ctx.putImageData(result,0,0);
}

function resetImage(){

    if(!originalImage){
        alert("Please upload an image first.");
        return;
    }

    canvas.width = originalImage.width;
    canvas.height = originalImage.height;

    ctx.drawImage(originalImage,0,0);
}

function downloadImage(){

    if(!originalImage){
        alert("Please upload an image first.");
        return;
    }

    const link = document.createElement("a");

    link.download = "toolsarthi-line-art.png";

    link.href = canvas.toDataURL("image/png");

    link.click();
}

</script>

</body>
  </html>
