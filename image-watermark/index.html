<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Watermark - ToolSarthi</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    input,
    select {
      margin: 10px 0;
      padding: 10px;
      font-size: 16px;
    }

    canvas {
      max-width: 100%;
      margin: 20px 0;
      border-radius: 10px;
      display: none;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 8px;
      display: none;
    }

    button:hover {
      background: #1d4ed8;
    }

    .controls {
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Image Watermark</h1>

    <p>Add a text watermark to your images easily.</p>

    <input type="file" id="imageInput" accept="image/*">

    <br>

    <div class="controls">

      <input
        type="text"
        id="watermarkText"
        placeholder="Enter watermark text"
      >

      <br>

      <select id="position">
        <option value="bottom-right">Bottom Right</option>
        <option value="bottom-left">Bottom Left</option>
        <option value="top-right">Top Right</option>
        <option value="top-left">Top Left</option>
        <option value="center">Center</option>
      </select>

    </div>

    <br>

    <canvas id="canvas"></canvas>

    <br>

    <button id="addBtn">Add Watermark</button>

    <button id="downloadBtn">Download Image</button>

  </div>

  <script>

    const imageInput = document.getElementById("imageInput");
    const watermarkText = document.getElementById("watermarkText");
    const position = document.getElementById("position");

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const addBtn = document.getElementById("addBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    let selectedImage = new Image();

    imageInput.addEventListener("change", function () {

      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (event) {

        selectedImage.onload = function () {

          canvas.width = selectedImage.width;
          canvas.height = selectedImage.height;

          ctx.drawImage(
            selectedImage,
            0,
            0
          );

          canvas.style.display = "block";

          addBtn.style.display = "inline-block";

          downloadBtn.style.display = "none";

        };

        selectedImage.src = event.target.result;

      };

      reader.readAsDataURL(file);

    });


    addBtn.addEventListener("click", function () {

      const text = watermarkText.value.trim();

      if (!text) {

        alert("Please enter watermark text.");

        return;

      }

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        selectedImage,
        0,
        0
      );

      const fontSize = Math.max(
        24,
        Math.floor(canvas.width / 25)
      );

      ctx.font = "bold " + fontSize + "px Arial";

      ctx.fillStyle = "rgba(255,255,255,0.75)";

      ctx.strokeStyle = "rgba(0,0,0,0.5)";

      ctx.lineWidth = 2;

      const padding = 30;

      const textWidth = ctx.measureText(text).width;

      let x;
      let y;

      if (position.value === "bottom-right") {

        x = canvas.width - textWidth - padding;
        y = canvas.height - padding;

      } else if (position.value === "bottom-left") {

        x = padding;
        y = canvas.height - padding;

      } else if (position.value === "top-right") {

        x = canvas.width - textWidth - padding;
        y = padding + fontSize;

      } else if (position.value === "top-left") {

        x = padding;
        y = padding + fontSize;

      } else {

        x = (canvas.width - textWidth) / 2;
        y = canvas.height / 2;

      }

      ctx.strokeText(
        text,
        x,
        y
      );

      ctx.fillText(
        text,
        x,
        y
      );

      downloadBtn.style.display = "inline-block";

    });


    downloadBtn.addEventListener("click", function () {

      const link = document.createElement("a");

      link.download = "watermarked-image.jpg";

      link.href = canvas.toDataURL(
        "image/jpeg",
        0.92
      );

      link.click();

    });

  </script>

</body>
  </html>
