<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Vignette Effect - ToolSarthi</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h1{
    margin-bottom:10px;
}

p{
    color:#666;
}

input[type="file"]{
    margin:20px 0;
}

canvas{
    max-width:100%;
    margin:15px 0;
    border-radius:10px;
}

.controls{
    margin:18px 0;
}

input[type="range"]{
    width:80%;
}

button{
    padding:12px 18px;
    margin:6px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#222;
    color:white;
    font-size:15px;
}

button:hover{
    opacity:0.85;
}
</style>
</head>

<body>

<div class="container">

<h1>🌑 Image Vignette Effect</h1>

<p>Darken the edges of your photos and focus attention on the center.</p>

<input type="file" id="upload" accept="image/*">

<div class="controls">

<label>
Vignette Strength:
<strong><span id="strengthValue">50</span></strong>
</label>

<br><br>

<input
    type="range"
    id="strength"
    min="0"
    max="100"
    value="50"
>

</div>

<canvas id="canvas"></canvas>

<br>

<button onclick="applyVignette()">Apply Effect</button>

<button onclick="resetImage()">Reset</button>

<button onclick="downloadImage()">Download Image</button>

</div>

<script>

const upload =
    document.getElementById("upload");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const strengthSlider =
    document.getElementById("strength");

const strengthValue =
    document.getElementById("strengthValue");

let originalImage = null;

strengthSlider.addEventListener("input", function(){

    strengthValue.textContent = this.value;

});

upload.addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    const img = new Image();

    img.onload = function(){

        originalImage = img;

        canvas.width = img.width;

        canvas.height = img.height;

        ctx.drawImage(img,0,0);

    };

    img.src = URL.createObjectURL(file);

});

function applyVignette(){

    if(!originalImage){

        alert("Please upload an image first.");

        return;
    }

    ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data =
        imageData.data;

    const strength =
        Number(strengthSlider.value) / 100;

    const centerX =
        canvas.width / 2;

    const centerY =
        canvas.height / 2;

    const maxDistance =
        Math.sqrt(
            centerX * centerX +
            centerY * centerY
        );

    for(let y = 0; y < canvas.height; y++){

        for(let x = 0; x < canvas.width; x++){

            const dx =
                x - centerX;

            const dy =
                y - centerY;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            const normalized =
                distance / maxDistance;

            const effect =
                Math.max(
                    0,
                    1 - normalized
                );

            const factor =
                1 - strength * (1 - effect);

            const index =
                (y * canvas.width + x) * 4;

            data[index] =
                Math.max(
                    0,
                    data[index] * factor
                );

            data[index + 1] =
                Math.max(
                    0,
                    data[index + 1] * factor
                );

            data[index + 2] =
                Math.max(
                    0,
                    data[index + 2] * factor
                );

        }
    }

    ctx.putImageData(
        imageData,
        0,
        0
    );

}

function resetImage(){

    if(!originalImage){

        alert("Please upload an image first.");

        return;
    }

    canvas.width =
        originalImage.width;

    canvas.height =
        originalImage.height;

    ctx.drawImage(
        originalImage,
        0,
        0
    );

}

function downloadImage(){

    if(!originalImage){

        alert("Please upload an image first.");

        return;
    }

    const link =
        document.createElement("a");

    link.download =
        "toolsarthi-vignette.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();

}

</script>

</body>
</html>
