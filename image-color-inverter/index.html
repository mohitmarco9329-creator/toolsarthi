<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Color Inverter - ToolSarthi</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    input {
      margin: 20px 0;
      padding: 10px;
      font-size: 16px;
    }

    canvas {
      max-width: 100%;
      max-height: 450px;
      margin: 20px 0;
      border-radius: 10px;
      display: none;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 8px;
      display: none;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Image Color Inverter</h1>

    <p>Invert image colors and create a negative photo effect.</p>

    <input type="file" id="imageInput" accept="image/*">

    <br>

    <canvas id="canvas"></canvas>

    <br>

    <button id="invertBtn">Invert Colors</button>

    <button id="downloadBtn">Download Image</button>

  </div>

  <script>

    const imageInput = document.getElementById("imageInput");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const invertBtn = document.getElementById("invertBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    let selectedImage = new Image();

    imageInput.addEventListener("change", function () {

      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (event) {

        selectedImage.onload = function () {

          canvas.width = selectedImage.width;
          canvas.height = selectedImage.height;

          ctx.drawImage(
            selectedImage,
            0,
            0
          );

          canvas.style.display = "block";

          invertBtn.style.display = "inline-block";

          downloadBtn.style.display = "none";

        };

        selectedImage.src = event.target.result;

      };

      reader.readAsDataURL(file);

    });


    invertBtn.addEventListener("click", function () {

      ctx.drawImage(
        selectedImage,
        0,
        0
      );

      const imageData = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );

      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {

        data[i] = 255 - data[i];

        data[i + 1] = 255 - data[i + 1];

        data[i + 2] = 255 - data[i + 2];

      }

      ctx.putImageData(
        imageData,
        0,
        0
      );

      downloadBtn.style.display = "inline-block";

    });


    downloadBtn.addEventListener("click", function () {

      const link = document.createElement("a");

      link.download = "inverted-image.jpg";

      link.href = canvas.toDataURL(
        "image/jpeg",
        0.92
      );

      link.click();

    });

  </script>

</body>
</html>
