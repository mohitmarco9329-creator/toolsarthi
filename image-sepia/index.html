<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Sepia Filter - ToolSarthi</title>

  <meta name="description" content="Apply a vintage sepia filter to your images and download them easily.">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    input[type="file"] {
      margin: 20px 0;
      padding: 10px;
    }

    canvas {
      max-width: 100%;
      height: auto;
      display: none;
      margin: 20px auto;
      border: 2px solid #ddd;
      border-radius: 10px;
    }

    button {
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
      margin: 8px;
      display: none;
    }

    button:hover {
      opacity: 0.9;
    }

    .controls {
      display: none;
      margin-top: 15px;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🟤 Image Sepia Filter</h1>

    <p>
      Give your image a classic vintage sepia effect.
    </p>

    <input type="file" id="imageInput" accept="image/*">

    <canvas id="canvas"></canvas>

    <div class="controls" id="controls">

      <button id="applyButton">
        🟤 Apply Sepia
      </button>

      <button id="downloadButton">
        ⬇️ Download Image
      </button>

    </div>

    <div class="message" id="message"></div>

  </div>

  <script>
    const imageInput =
      document.getElementById("imageInput");

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");

    const controls =
      document.getElementById("controls");

    const applyButton =
      document.getElementById("applyButton");

    const downloadButton =
      document.getElementById("downloadButton");

    const message =
      document.getElementById("message");

    let originalImage = new Image();

    imageInput.addEventListener("change", function() {

      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {

        originalImage.onload = function() {

          canvas.width =
            originalImage.naturalWidth;

          canvas.height =
            originalImage.naturalHeight;

          ctx.drawImage(
            originalImage,
            0,
            0
          );

          canvas.style.display = "block";
          controls.style.display = "block";

          message.textContent =
            "Image loaded successfully.";

        };

        originalImage.src = e.target.result;
      };

      reader.readAsDataURL(file);
    });


    applyButton.addEventListener("click", function() {

      const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        const newR =
          (r * 0.393) +
          (g * 0.769) +
          (b * 0.189);

        const newG =
          (r * 0.349) +
          (g * 0.686) +
          (b * 0.168);

        const newB =
          (r * 0.272) +
          (g * 0.534) +
          (b * 0.131);

        data[i] =
          Math.min(255, newR);

        data[i + 1] =
          Math.min(255, newG);

        data[i + 2] =
          Math.min(255, newB);
      }

      ctx.putImageData(
        imageData,
        0,
        0
      );

      message.textContent =
        "✅ Sepia effect applied!";
    });


    downloadButton.addEventListener("click", function() {

      const link =
        document.createElement("a");

      link.download =
        "sepia-image.png";

      link.href =
        canvas.toDataURL("image/png");

      link.click();

    });
  </script>

</body>
</html>
