<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Rotator - ToolSarthi</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    input {
      margin: 20px 0;
    }

    canvas {
      max-width: 100%;
      max-height: 450px;
      margin: 20px auto;
      border: 1px solid #ddd;
      display: none;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background: #1d4ed8;
    }

    #downloadBtn {
      background: #16a34a;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Image Rotator</h1>

    <p>Rotate your images easily and download them.</p>

    <input type="file" id="imageInput" accept="image/*">

    <br>

    <canvas id="canvas"></canvas>

    <br>

    <button id="leftBtn">↶ Rotate Left</button>

    <button id="rightBtn">↷ Rotate Right</button>

    <br>

    <button id="downloadBtn">Download Rotated Image</button>

  </div>

  <script>

    const imageInput = document.getElementById("imageInput");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    let image = new Image();
    let angle = 0;

    imageInput.addEventListener("change", function () {

      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (event) {

        image.onload = function () {

          angle = 0;

          drawImage();

          canvas.style.display = "block";
          downloadBtn.style.display = "inline-block";
        };

        image.src = event.target.result;
      };

      reader.readAsDataURL(file);
    });


    function drawImage() {

      const radians = angle * Math.PI / 180;

      const isRotated = Math.abs(angle % 180) === 90;

      if (isRotated) {
        canvas.width = image.height;
        canvas.height = image.width;
      } else {
        canvas.width = image.width;
        canvas.height = image.height;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();

      ctx.translate(canvas.width / 2, canvas.height / 2);

      ctx.rotate(radians);

      ctx.drawImage(
        image,
        -image.width / 2,
        -image.height / 2
      );

      ctx.restore();
    }


    leftBtn.addEventListener("click", function () {

      angle -= 90;

      drawImage();

    });


    rightBtn.addEventListener("click", function () {

      angle += 90;

      drawImage();

    });


    downloadBtn.addEventListener("click", function () {

      const link = document.createElement("a");

      link.download = "rotated-image.jpg";

      link.href = canvas.toDataURL("image/jpeg", 0.92);

      link.click();

    });

  </script>

</body>
</html>
