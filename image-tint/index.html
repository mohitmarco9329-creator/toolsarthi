<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Tint & Color Filter - ToolSarthi</title>

  <meta name="description" content="Apply red, blue, green, purple and orange color filters to images online.">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    input[type="file"] {
      margin: 20px 0;
      padding: 10px;
    }

    canvas {
      max-width: 100%;
      height: auto;
      display: none;
      margin: 20px auto;
      border: 2px solid #ddd;
      border-radius: 10px;
    }

    .controls {
      display: none;
      margin-top: 20px;
    }

    select {
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin: 10px;
    }

    button {
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
      margin: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎨 Image Tint & Color Filter</h1>

    <p>
      Apply different color filters to your image.
    </p>

    <input type="file" id="imageInput" accept="image/*">

    <canvas id="canvas"></canvas>

    <div class="controls" id="controls">

      <select id="filterSelect">

        <option value="none">Original</option>
        <option value="red">Red Tint</option>
        <option value="blue">Blue Tint</option>
        <option value="green">Green Tint</option>
        <option value="purple">Purple Tint</option>
        <option value="orange">Orange Tint</option>

      </select>

      <br>

      <button id="applyButton">
        🎨 Apply Filter
      </button>

      <button id="resetButton">
        🔄 Reset
      </button>

      <button id="downloadButton">
        ⬇️ Download Image
      </button>

    </div>

    <div class="message" id="message"></div>

  </div>

  <script>

    const imageInput =
      document.getElementById("imageInput");

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");

    const controls =
      document.getElementById("controls");

    const filterSelect =
      document.getElementById("filterSelect");

    const applyButton =
      document.getElementById("applyButton");

    const resetButton =
      document.getElementById("resetButton");

    const downloadButton =
      document.getElementById("downloadButton");

    const message =
      document.getElementById("message");

    let originalImage = new Image();


    imageInput.addEventListener("change", function() {

      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {

        originalImage.onload = function() {

          canvas.width =
            originalImage.naturalWidth;

          canvas.height =
            originalImage.naturalHeight;

          filterSelect.value = "none";

          drawOriginal();

          canvas.style.display = "block";

          controls.style.display = "block";

          message.textContent =
            "Image loaded successfully.";

        };

        originalImage.src = e.target.result;

      };

      reader.readAsDataURL(file);

    });


    function drawOriginal() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        originalImage,
        0,
        0
      );

    }


    applyButton.addEventListener("click", function() {

      drawOriginal();

      const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

      const data = imageData.data;

      const filter =
        filterSelect.value;


      for (let i = 0; i < data.length; i += 4) {

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];


        if (filter === "red") {

          data[i] =
            Math.min(255, r * 1.25);

          data[i + 1] =
            g * 0.55;

          data[i + 2] =
            b * 0.55;

        }


        else if (filter === "blue") {

          data[i] =
            r * 0.55;

          data[i + 1] =
            g * 0.75;

          data[i + 2] =
            Math.min(255, b * 1.3);

        }


        else if (filter === "green") {

          data[i] =
            r * 0.55;

          data[i + 1] =
            Math.min(255, g * 1.25);

          data[i + 2] =
            b * 0.55;

        }


        else if (filter === "purple") {

          data[i] =
            Math.min(255, r * 1.15);

          data[i + 1] =
            g * 0.55;

          data[i + 2] =
            Math.min(255, b * 1.25);

        }


        else if (filter === "orange") {

          data[i] =
            Math.min(255, r * 1.2);

          data[i + 1] =
            Math.min(255, g * 0.85);

          data[i + 2] =
            b * 0.45;

        }

      }


      ctx.putImageData(
        imageData,
        0,
        0
      );


      message.textContent =
        "✅ Color filter applied!";

    });


    resetButton.addEventListener("click", function() {

      filterSelect.value = "none";

      drawOriginal();

      message.textContent =
        "✅ Original image restored.";

    });


    downloadButton.addEventListener("click", function() {

      const link =
        document.createElement("a");

      link.download =
        "tinted-image.png";

      link.href =
        canvas.toDataURL("image/png");

      link.click();

    });

  </script>

</body>
  </html>
