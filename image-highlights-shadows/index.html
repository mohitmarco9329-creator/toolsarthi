<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Highlights & Shadows Adjuster - ToolSarthi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    input[type="file"] {
      margin: 20px 0;
      padding: 10px;
    }

    .control {
      margin: 20px 0;
    }

    input[type="range"] {
      width: 80%;
    }

    .value {
      font-weight: bold;
      margin-left: 8px;
    }

    canvas {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      display: none;
    }

    button {
      border: none;
      padding: 12px 20px;
      margin: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    .download {
      background: #198754;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>☀️ Image Highlights & Shadows Adjuster</h1>

    <p>
      Recover bright highlights and lift dark shadows in your photos.
    </p>

    <input type="file" id="upload" accept="image/*">

    <div class="control">

      <label>
        Highlights:
        <span class="value" id="highlightsValue">0</span>
      </label>

      <br><br>

      <input
        type="range"
        id="highlights"
        min="-100"
        max="100"
        value="0"
      >

    </div>

    <div class="control">

      <label>
        Shadows:
        <span class="value" id="shadowsValue">0</span>
      </label>

      <br><br>

      <input
        type="range"
        id="shadows"
        min="-100"
        max="100"
        value="0"
      >

    </div>

    <div>

      <button onclick="applyEffect()">Apply Effect</button>

      <button onclick="resetImage()">Reset</button>

      <button class="download" onclick="downloadImage()">
        Download
      </button>

    </div>

    <canvas id="canvas"></canvas>

  </div>

  <script>

    const upload =
      document.getElementById("upload");

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");

    const highlights =
      document.getElementById("highlights");

    const shadows =
      document.getElementById("shadows");

    const highlightsValue =
      document.getElementById("highlightsValue");

    const shadowsValue =
      document.getElementById("shadowsValue");

    let originalImage = null;

    highlights.addEventListener("input", function() {

      highlightsValue.textContent = this.value;

    });

    shadows.addEventListener("input", function() {

      shadowsValue.textContent = this.value;

    });

    upload.addEventListener("change", function(event) {

      const file = event.target.files[0];

      if (!file) return;

      const img = new Image();

      img.onload = function() {

        originalImage = img;

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );

        canvas.style.display = "block";
      };

      img.src = URL.createObjectURL(file);

    });

    function applyEffect() {

      if (!originalImage) {

        alert("Please upload an image first.");

        return;
      }

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

      const data = imageData.data;

      const highlightAmount =
        Number(highlights.value) / 100;

      const shadowAmount =
        Number(shadows.value) / 100;

      for (let i = 0; i < data.length; i += 4) {

        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];

        const brightness =
          (r + g + b) / 3;

        if (brightness > 160) {

          const factor =
            highlightAmount *
            ((brightness - 160) / 95);

          r += factor * 100;
          g += factor * 100;
          b += factor * 100;

        }

        if (brightness < 100) {

          const factor =
            shadowAmount *
            ((100 - brightness) / 100);

          r += factor * 100;
          g += factor * 100;
          b += factor * 100;

        }

        data[i] =
          Math.max(0, Math.min(255, r));

        data[i + 1] =
          Math.max(0, Math.min(255, g));

        data[i + 2] =
          Math.max(0, Math.min(255, b));
      }

      ctx.putImageData(
        imageData,
        0,
        0
      );
    }

    function resetImage() {

      if (!originalImage) {

        alert("Please upload an image first.");

        return;
      }

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
      );

      highlights.value = 0;
      shadows.value = 0;

      highlightsValue.textContent = "0";
      shadowsValue.textContent = "0";
    }

    function downloadImage() {

      if (!originalImage) {

        alert("Please upload an image first.");

        return;
      }

      const link =
        document.createElement("a");

      link.download =
        "toolsarthi-highlights-shadows.png";

      link.href =
        canvas.toDataURL("image/png");

      link.click();
    }

  </script>

</body>
  </html>
