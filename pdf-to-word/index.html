<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to Word - ToolSarthi</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    input {
      margin: 20px 0;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>📄 PDF to Word</h1>
    <p>Convert PDF text into an editable Word document.</p>

    <input type="file" id="pdfFile" accept="application/pdf">

    <br>

    <button id="convertBtn" disabled>Convert to Word</button>

    <p id="status"></p>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const fileInput = document.getElementById("pdfFile");
    const convertBtn = document.getElementById("convertBtn");
    const status = document.getElementById("status");

    fileInput.addEventListener("change", () => {
      convertBtn.disabled = !fileInput.files.length;
    });

    convertBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];

      if (!file) return;

      try {
        convertBtn.disabled = true;
        status.textContent = "Converting...";

        const arrayBuffer = await file.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
          data: arrayBuffer
        }).promise;

        const paragraphs = [];

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

          const page = await pdf.getPage(pageNumber);
          const content = await page.getTextContent();

          const text = content.items
            .map(item => item.str)
            .join(" ");

          if (text.trim()) {
            paragraphs.push(
              new docx.Paragraph({
                text: text.trim()
              })
            );
          }

          paragraphs.push(
            new docx.Paragraph({
              text: ""
            })
          );
        }

        const document = new docx.Document({
          sections: [{
            children: paragraphs
          }]
        });

        const blob = await docx.Packer.toBlob(document);

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        a.href = url;
        a.download = "ToolSarthi-PDF-to-Word.docx";

        document.body.appendChild(a);
        a.click();
        a.remove();

        URL.revokeObjectURL(url);

        status.textContent = "✅ Word file ready!";
      } catch (error) {
        console.error(error);
        status.textContent = "❌ Conversion failed. Please try another PDF.";
      }

      convertBtn.disabled = false;
    });
  </script>

</body>
</html>
