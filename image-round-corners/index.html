<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Round Corners - ToolSarthi</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    input,
    select {
      margin: 15px 0;
      padding: 10px;
      font-size: 16px;
    }

    canvas {
      max-width: 100%;
      max-height: 450px;
      margin: 20px 0;
      border-radius: 10px;
      display: none;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 8px;
      display: none;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Image Round Corners</h1>

    <p>Give your images smooth rounded corners.</p>

    <input type="file" id="imageInput" accept="image/*">

    <br>

    <select id="radius">
      <option value="20">Small Round</option>
      <option value="50" selected>Medium Round</option>
      <option value="100">Large Round</option>
      <option value="180">Extra Large Round</option>
    </select>

    <br>

    <canvas id="canvas"></canvas>

    <br>

    <button id="roundBtn">Round Corners</button>

    <button id="downloadBtn">Download Image</button>

  </div>

  <script>

    const imageInput = document.getElementById("imageInput");
    const radiusSelect = document.getElementById("radius");

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const roundBtn = document.getElementById("roundBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    let selectedImage = new Image();

    imageInput.addEventListener("change", function () {

      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (event) {

        selectedImage.onload = function () {

          canvas.width = selectedImage.width;
          canvas.height = selectedImage.height;

          ctx.drawImage(
            selectedImage,
            0,
            0
          );

          canvas.style.display = "block";

          roundBtn.style.display = "inline-block";

          downloadBtn.style.display = "none";

        };

        selectedImage.src = event.target.result;

      };

      reader.readAsDataURL(file);

    });


    roundBtn.addEventListener("click", function () {

      const radius = parseInt(
        radiusSelect.value
      );

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.save();

      ctx.beginPath();

      ctx.moveTo(
        radius,
        0
      );

      ctx.lineTo(
        canvas.width - radius,
        0
      );

      ctx.quadraticCurveTo(
        canvas.width,
        0,
        canvas.width,
        radius
      );

      ctx.lineTo(
        canvas.width,
        canvas.height - radius
      );

      ctx.quadraticCurveTo(
        canvas.width,
        canvas.height,
        canvas.width - radius,
        canvas.height
      );

      ctx.lineTo(
        radius,
        canvas.height
      );

      ctx.quadraticCurveTo(
        0,
        canvas.height,
        0,
        canvas.height - radius
      );

      ctx.lineTo(
        0,
        radius
      );

      ctx.quadraticCurveTo(
        0,
        0,
        radius,
        0
      );

      ctx.closePath();

      ctx.clip();

      ctx.drawImage(
        selectedImage,
        0,
        0
      );

      ctx.restore();

      downloadBtn.style.display = "inline-block";

    });


    downloadBtn.addEventListener("click", function () {

      const link = document.createElement("a");

      link.download = "rounded-image.png";

      link.href = canvas.toDataURL(
        "image/png"
      );

      link.click();

    });

  </script>

</body>
  </html>
