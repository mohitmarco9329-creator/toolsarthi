<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PDF Page Reorder - ToolSarthi</title>
  <meta name="description" content="Reorder PDF pages online for free with ToolSarthi.">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      font-size: 15px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px dashed #2563eb;
      border-radius: 10px;
      background: #f8fafc;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #pageInfo {
      font-weight: bold;
      margin: 10px 0 15px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.5;
    }

    .home-link {
      display: block;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <header>
    <h1>PDF Page Reorder</h1>
    <p>Change the order of PDF pages easily and download a new PDF.</p>
  </header>

  <div class="container">
    <div class="card">

      <input type="file" id="pdfFile" accept="application/pdf">

      <div id="pageInfo">Please select a PDF file.</div>

      <input
        type="text"
        id="pageOrder"
        placeholder="Example: 3,1,2"
      >

      <button id="reorderBtn" disabled>
        Reorder PDF
      </button>

      <div id="status"></div>

      <a class="home-link" href="../index.html">
        ← Back to ToolSarthi Home
      </a>

      <div class="note">
        Your PDF is processed directly in your browser.
        It is not uploaded to our server.
      </div>

    </div>
  </div>

  <script>
    const pdfFile = document.getElementById("pdfFile");
    const pageInfo = document.getElementById("pageInfo");
    const pageOrder = document.getElementById("pageOrder");
    const reorderBtn = document.getElementById("reorderBtn");
    const status = document.getElementById("status");

    let selectedFile = null;
    let totalPages = 0;

    pdfFile.addEventListener("change", async function () {

      selectedFile = this.files[0];

      if (!selectedFile) {
        reorderBtn.disabled = true;
        pageInfo.textContent = "Please select a PDF file.";
        return;
      }

      if (selectedFile.type !== "application/pdf") {
        reorderBtn.disabled = true;
        pageInfo.textContent = "Please select a valid PDF file.";
        return;
      }

      try {
        const bytes = await selectedFile.arrayBuffer();

        const pdfDoc =
          await PDFLib.PDFDocument.load(bytes);

        totalPages = pdfDoc.getPageCount();

        pageInfo.textContent =
          "PDF loaded successfully. Total pages: " + totalPages;

        pageOrder.value = "";

        reorderBtn.disabled = false;
        status.textContent = "";

      } catch (error) {

        pageInfo.textContent =
          "Unable to read this PDF.";

        reorderBtn.disabled = true;

        console.error(error);
      }
    });

    function getPageOrder(input) {

      if (!input.trim()) {
        throw new Error("Please enter the page order.");
      }

      const numbers = input
        .split(",")
        .map(item => parseInt(item.trim()));

      if (numbers.some(number => isNaN(number))) {
        throw new Error("Please enter valid page numbers.");
      }

      if (numbers.length !== totalPages) {
        throw new Error(
          "Please enter all " + totalPages + " page numbers."
        );
      }

      const uniqueNumbers = new Set(numbers);

      if (uniqueNumbers.size !== totalPages) {
        throw new Error(
          "Each page number must be used only once."
        );
      }

      for (const number of numbers) {

        if (number < 1 || number > totalPages) {
          throw new Error(
            "Page numbers must be between 1 and " + totalPages + "."
          );
        }
      }

      return numbers;
    }

    reorderBtn.addEventListener("click", async function () {

      try {

        status.textContent = "Reordering PDF...";

        const inputBytes =
          await selectedFile.arrayBuffer();

        const sourcePdf =
          await PDFLib.PDFDocument.load(inputBytes);

        const outputPdf =
          await PDFLib.PDFDocument.create();

        const order =
          getPageOrder(pageOrder.value);

        const copiedPages =
          await outputPdf.copyPages(
            sourcePdf,
            order.map(page => page - 1)
          );

        copiedPages.forEach(page => {
          outputPdf.addPage(page);
        });

        const pdfBytes =
          await outputPdf.save();

        const blob =
          new Blob([pdfBytes], {
            type: "application/pdf"
          });

        const url =
          URL.createObjectURL(blob);

        const link =
          document.createElement("a");

        link.href = url;
        link.download = "reordered-pages.pdf";

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        URL.revokeObjectURL(url);

        status.textContent =
          "PDF reordered successfully! Download started.";

      } catch (error) {

        console.error(error);

        status.textContent =
          "Error: " + error.message;
      }
    });
  </script>

</body>
  </html>
