<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PDF Page Extractor - ToolSarthi</title>
  <meta name="description" content="Extract selected pages from a PDF and download them as a new PDF for free with ToolSarthi.">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      font-size: 15px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px dashed #2563eb;
      border-radius: 10px;
      background: #f8fafc;
      margin-bottom: 20px;
    }

    #pageInfo {
      font-weight: bold;
      margin: 15px 0;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .home-link {
      display: block;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>PDF Page Extractor</h1>
    <p>Extract selected pages from your PDF easily and for free.</p>
  </header>

  <div class="container">
    <div class="card">

      <input type="file" id="pdfFile" accept="application/pdf">

      <div id="pageInfo">Please select a PDF file.</div>

      <input
        type="text"
        id="pageNumbers"
        placeholder="Example: 1,3,5 or 2-4"
      >

      <button id="extractBtn" disabled>
        Extract Pages
      </button>

      <div id="status"></div>

      <a class="home-link" href="../index.html">
        ← Back to ToolSarthi Home
      </a>

      <div class="note">
        Your PDF is processed directly in your browser.
        It is not uploaded to our server.
      </div>

    </div>
  </div>

  <script>
    const pdfFile = document.getElementById("pdfFile");
    const pageInfo = document.getElementById("pageInfo");
    const pageNumbers = document.getElementById("pageNumbers");
    const extractBtn = document.getElementById("extractBtn");
    const status = document.getElementById("status");

    let selectedFile = null;
    let totalPages = 0;

    pdfFile.addEventListener("change", async function () {
      selectedFile = this.files[0];

      if (!selectedFile) {
        extractBtn.disabled = true;
        pageInfo.textContent = "Please select a PDF file.";
        return;
      }

      if (selectedFile.type !== "application/pdf") {
        pageInfo.textContent = "Please select a valid PDF file.";
        extractBtn.disabled = true;
        return;
      }

      try {
        const bytes = await selectedFile.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(bytes);

        totalPages = pdfDoc.getPageCount();

        pageInfo.textContent =
          "PDF loaded successfully. Total pages: " + totalPages;

        extractBtn.disabled = false;
        status.textContent = "";

      } catch (error) {
        pageInfo.textContent = "Unable to read this PDF.";
        extractBtn.disabled = true;
        console.error(error);
      }
    });

    function getPageNumbers(input) {
      const pages = new Set();

      const parts = input.split(",");

      for (const part of parts) {
        const value = part.trim();

        if (value.includes("-")) {
          const range = value.split("-");

          const start = parseInt(range[0]);
          const end = parseInt(range[1]);

          if (
            isNaN(start) ||
            isNaN(end) ||
            start < 1 ||
            end > totalPages ||
            start > end
          ) {
            throw new Error("Invalid page range.");
          }

          for (let i = start; i <= end; i++) {
            pages.add(i);
          }

        } else {
          const page = parseInt(value);

          if (
            isNaN(page) ||
            page < 1 ||
            page > totalPages
          ) {
            throw new Error("Invalid page number.");
          }

          pages.add(page);
        }
      }

      return Array.from(pages).sort((a, b) => a - b);
    }

    extractBtn.addEventListener("click", async function () {

      if (!selectedFile) {
        return;
      }

      try {
        status.textContent = "Extracting pages...";

        const inputBytes = await selectedFile.arrayBuffer();

        const sourcePdf =
          await PDFLib.PDFDocument.load(inputBytes);

        const outputPdf =
          await PDFLib.PDFDocument.create();

        const pages = getPageNumbers(pageNumbers.value);

        if (pages.length === 0) {
          throw new Error("Please enter page numbers.");
        }

        const copiedPages =
          await outputPdf.copyPages(
            sourcePdf,
            pages.map(page => page - 1)
          );

        copiedPages.forEach(page => {
          outputPdf.addPage(page);
        });

        const pdfBytes =
          await outputPdf.save();

        const blob =
          new Blob([pdfBytes], {
            type: "application/pdf"
          });

        const url =
          URL.createObjectURL(blob);

        const link =
          document.createElement("a");

        link.href = url;
        link.download = "extracted-pages.pdf";

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        URL.revokeObjectURL(url);

        status.textContent =
          "Pages extracted successfully! Download started.";

      } catch (error) {

        console.error(error);

        status.textContent =
          "Error: " + error.message;
      }
    });
  </script>

</body>
</html>
