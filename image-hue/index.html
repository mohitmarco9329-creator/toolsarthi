<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Hue Changer - ToolSarthi</title>

  <meta name="description" content="Change image colors using a hue adjustment slider online.">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    input[type="file"] {
      margin: 20px 0;
      padding: 10px;
    }

    canvas {
      max-width: 100%;
      height: auto;
      display: none;
      margin: 20px auto;
      border: 2px solid #ddd;
      border-radius: 10px;
    }

    .controls {
      display: none;
      margin-top: 20px;
      text-align: left;
    }

    .control {
      margin: 18px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 100%;
    }

    .value {
      font-weight: bold;
    }

    .buttons {
      text-align: center;
    }

    button {
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
      margin: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌈 Image Hue Changer</h1>

    <p>
      Change the color tone of your image with the hue slider.
    </p>

    <input type="file" id="imageInput" accept="image/*">

    <canvas id="canvas"></canvas>

    <div class="controls" id="controls">

      <div class="control">

        <label>
          Hue:
          <span class="value" id="hueValue">0°</span>
        </label>

        <input
          type="range"
          id="hue"
          min="0"
          max="360"
          value="0"
        >

      </div>

      <div class="buttons">

        <button id="resetButton">
          🔄 Reset
        </button>

        <button id="downloadButton">
          ⬇️ Download Image
        </button>

      </div>

    </div>

    <div class="message" id="message"></div>

  </div>

  <script>

    const imageInput =
      document.getElementById("imageInput");

    const canvas =
      document.getElementById("canvas");

    const ctx =
      canvas.getContext("2d");

    const controls =
      document.getElementById("controls");

    const hue =
      document.getElementById("hue");

    const hueValue =
      document.getElementById("hueValue");

    const resetButton =
      document.getElementById("resetButton");

    const downloadButton =
      document.getElementById("downloadButton");

    const message =
      document.getElementById("message");

    let originalImage = new Image();


    imageInput.addEventListener("change", function() {

      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {

        originalImage.onload = function() {

          canvas.width =
            originalImage.naturalWidth;

          canvas.height =
            originalImage.naturalHeight;

          hue.value = 0;

          hueValue.textContent = "0°";

          drawImage();

          canvas.style.display = "block";

          controls.style.display = "block";

          message.textContent =
            "Image loaded successfully.";

        };

        originalImage.src = e.target.result;

      };

      reader.readAsDataURL(file);

    });


    function drawImage() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        originalImage,
        0,
        0
      );

      const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

      const data = imageData.data;

      const shift =
        Number(hue.value);

      for (let i = 0; i < data.length; i += 4) {

        const r = data[i] / 255;
        const g = data[i + 1] / 255;
        const b = data[i + 2] / 255;

        const hsv =
          rgbToHsv(r, g, b);

        hsv.h =
          (hsv.h + shift) % 360;

        const rgb =
          hsvToRgb(
            hsv.h,
            hsv.s,
            hsv.v
          );

        data[i] =
          Math.round(rgb.r * 255);

        data[i + 1] =
          Math.round(rgb.g * 255);

        data[i + 2] =
          Math.round(rgb.b * 255);
      }

      ctx.putImageData(
        imageData,
        0,
        0
      );
    }


    function rgbToHsv(r, g, b) {

      const max =
        Math.max(r, g, b);

      const min =
        Math.min(r, g, b);

      const d = max - min;

      let h = 0;

      if (d !== 0) {

        if (max === r) {
          h = 60 * (((g - b) / d) % 6);
        } else if (max === g) {
          h = 60 * (((b - r) / d) + 2);
        } else {
          h = 60 * (((r - g) / d) + 4);
        }
      }

      if (h < 0) {
        h += 360;
      }

      const s =
        max === 0 ? 0 : d / max;

      return {
        h: h,
        s: s,
        v: max
      };
    }


    function hsvToRgb(h, s, v) {

      const c = v * s;

      const x =
        c *
        (1 - Math.abs((h / 60) % 2 - 1));

      const m = v - c;

      let r = 0;
      let g = 0;
      let b = 0;

      if (h < 60) {
        r = c;
        g = x;
      } else if (h < 120) {
        r = x;
        g = c;
      } else if (h < 180) {
        g = c;
        b = x;
      } else if (h < 240) {
        g = x;
        b = c;
      } else if (h < 300) {
        r = x;
        b = c;
      } else {
        r = c;
        b = x;
      }

      return {
        r: r + m,
        g: g + m,
        b: b + m
      };
    }


    hue.addEventListener("input", function() {

      hueValue.textContent =
        hue.value + "°";

      drawImage();

    });


    resetButton.addEventListener("click", function() {

      hue.value = 0;

      hueValue.textContent = "0°";

      drawImage();

      message.textContent =
        "✅ Hue reset successfully.";

    });


    downloadButton.addEventListener("click", function() {

      const link =
        document.createElement("a");

      link.download =
        "hue-changed-image.png";

      link.href =
        canvas.toDataURL("image/png");

      link.click();

    });

  </script>

</body>
</html>
