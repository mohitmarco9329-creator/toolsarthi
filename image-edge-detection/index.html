<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Edge Detection - ToolSarthi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    input[type="file"] {
      margin: 20px 0;
    }

    .controls {
      margin: 15px 0;
    }

    input[type="range"] {
      width: 180px;
      margin: 8px;
    }

    button {
      margin: 8px;
      padding: 11px 18px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    canvas {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 10px;
    }

    #downloadBtn {
      display: none;
      background: #0a7cff;
    }

    .value {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔲 Image Edge Detection</h1>
    <p>Highlight image edges and create a clean outline effect.</p>

    <input type="file" id="imageInput" accept="image/*">

    <div class="controls">

      <label>
        Edge Strength:
        <input
          type="range"
          id="strength"
          min="10"
          max="100"
          value="60"
        >
        <span class="value" id="strengthValue">60</span>
      </label>

      <br>

      <button onclick="applyEdges()">Detect Edges</button>
      <button onclick="resetImage()">Reset</button>
      <button id="downloadBtn" onclick="downloadImage()">Download Image</button>

    </div>

    <canvas id="canvas"></canvas>

  </div>

<script>

const imageInput = document.getElementById("imageInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const strength = document.getElementById("strength");
const strengthValue = document.getElementById("strengthValue");
const downloadBtn = document.getElementById("downloadBtn");

let originalImage = new Image();

strength.addEventListener("input", function () {
  strengthValue.textContent = this.value;
});


imageInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function (event) {

    originalImage.onload = function () {

      canvas.width = originalImage.width;
      canvas.height = originalImage.height;

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
      );

      downloadBtn.style.display = "none";
    };

    originalImage.src = event.target.result;
  };

  reader.readAsDataURL(file);
});


function applyEdges() {

  if (!originalImage.src) {
    alert("Please upload an image first.");
    return;
  }

  ctx.drawImage(
    originalImage,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const imageData = ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const data = imageData.data;

  const width = canvas.width;
  const height = canvas.height;

  const amount = Number(strength.value) / 100;

  const gray = new Float32Array(width * height);

  for (let y = 0; y < height; y++) {

    for (let x = 0; x < width; x++) {

      const index = (y * width + x) * 4;

      gray[y * width + x] =
        0.299 * data[index] +
        0.587 * data[index + 1] +
        0.114 * data[index + 2];
    }
  }


  for (let y = 1; y < height - 1; y++) {

    for (let x = 1; x < width - 1; x++) {

      const topLeft =
        gray[(y - 1) * width + (x - 1)];

      const top =
        gray[(y - 1) * width + x];

      const topRight =
        gray[(y - 1) * width + (x + 1)];

      const left =
        gray[y * width + (x - 1)];

      const right =
        gray[y * width + (x + 1)];

      const bottomLeft =
        gray[(y + 1) * width + (x - 1)];

      const bottom =
        gray[(y + 1) * width + x];

      const bottomRight =
        gray[(y + 1) * width + (x + 1)];


      const gx =
        -topLeft -
        2 * left -
        bottomLeft +
        topRight +
        2 * right +
        bottomRight;


      const gy =
        -topLeft -
        2 * top -
        topRight +
        bottomLeft +
        2 * bottom +
        bottomRight;


      let edge =
        Math.sqrt(gx * gx + gy * gy);

      edge =
        Math.min(
          255,
          edge * (0.7 + amount * 1.8)
        );


      const index =
        (y * width + x) * 4;

      const value =
        255 - edge;


      data[index] = value;
      data[index + 1] = value;
      data[index + 2] = value;
      data[index + 3] = 255;
    }
  }

  ctx.putImageData(imageData, 0, 0);

  downloadBtn.style.display = "inline-block";
}


function resetImage() {

  if (!originalImage.src) return;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.drawImage(
    originalImage,
    0,
    0,
    canvas.width,
    canvas.height
  );

  downloadBtn.style.display = "none";
}


function downloadImage() {

  const link = document.createElement("a");

  link.download = "toolsarthi-edge-detection.png";

  link.href = canvas.toDataURL("image/png");

  link.click();
}

</script>

</body>
</html>
