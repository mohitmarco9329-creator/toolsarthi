<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Text Maker - ToolSarthi</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    input,
    select {
      margin: 10px 0;
      padding: 10px;
      font-size: 16px;
      max-width: 90%;
    }

    canvas {
      max-width: 100%;
      max-height: 450px;
      margin: 20px 0;
      border-radius: 10px;
      display: none;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 8px;
      display: none;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Image Text Maker</h1>

    <p>Add custom text to your images easily.</p>

    <input type="file" id="imageInput" accept="image/*">

    <br>

    <input
      type="text"
      id="textInput"
      placeholder="Enter your text"
    >

    <br>

    <select id="position">
      <option value="bottom">Bottom</option>
      <option value="center">Center</option>
      <option value="top">Top</option>
    </select>

    <br>

    <canvas id="canvas"></canvas>

    <br>

    <button id="addTextBtn">Add Text</button>

    <button id="downloadBtn">Download Image</button>

  </div>

  <script>

    const imageInput = document.getElementById("imageInput");
    const textInput = document.getElementById("textInput");
    const position = document.getElementById("position");

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const addTextBtn = document.getElementById("addTextBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    let selectedImage = new Image();

    imageInput.addEventListener("change", function () {

      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (event) {

        selectedImage.onload = function () {

          canvas.width = selectedImage.width;
          canvas.height = selectedImage.height;

          ctx.drawImage(
            selectedImage,
            0,
            0
          );

          canvas.style.display = "block";

          addTextBtn.style.display = "inline-block";

          downloadBtn.style.display = "none";

        };

        selectedImage.src = event.target.result;

      };

      reader.readAsDataURL(file);

    });


    addTextBtn.addEventListener("click", function () {

      const text = textInput.value.trim();

      if (!text) {

        alert("Please enter some text.");

        return;

      }

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        selectedImage,
        0,
        0
      );

      const fontSize = Math.max(
        28,
        Math.floor(canvas.width / 15)
      );

      ctx.font = "bold " + fontSize + "px Arial";

      ctx.textAlign = "center";

      ctx.lineWidth = 4;

      ctx.strokeStyle = "black";

      ctx.fillStyle = "white";

      let y;

      if (position.value === "top") {

        y = fontSize + 30;

      } else if (position.value === "center") {

        y = canvas.height / 2;

      } else {

        y = canvas.height - 30;

      }

      ctx.strokeText(
        text,
        canvas.width / 2,
        y
      );

      ctx.fillText(
        text,
        canvas.width / 2,
        y
      );

      downloadBtn.style.display = "inline-block";

    });


    downloadBtn.addEventListener("click", function () {

      const link = document.createElement("a");

      link.download = "image-with-text.jpg";

      link.href = canvas.toDataURL(
        "image/jpeg",
        0.92
      );

      link.click();

    });

  </script>

</body>
</html>
