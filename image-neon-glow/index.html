<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Neon Glow Effect - ToolSarthi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    input[type="file"] {
      margin: 20px 0;
    }

    .controls {
      margin: 15px 0;
    }

    select,
    input[type="range"],
    button {
      margin: 8px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      cursor: pointer;
      background: #222;
      color: white;
      border: none;
      padding: 11px 18px;
    }

    button:hover {
      opacity: 0.85;
    }

    canvas {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 10px;
    }

    #downloadBtn {
      display: none;
      background: #0a7cff;
    }

    .value {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💡 Image Neon Glow Effect</h1>
    <p>Add a colorful neon glow effect to your images.</p>

    <input type="file" id="imageInput" accept="image/*">

    <div class="controls">

      <label>
        Neon Color:
        <select id="colorSelect">
          <option value="cyan">Cyan</option>
          <option value="pink">Pink</option>
          <option value="green">Green</option>
          <option value="purple">Purple</option>
        </select>
      </label>

      <br>

      <label>
        Glow Intensity:
        <input type="range" id="intensity" min="10" max="100" value="60">
        <span class="value" id="intensityValue">60</span>
      </label>

      <br>

      <button onclick="applyNeon()">Apply Neon Glow</button>
      <button onclick="resetImage()">Reset</button>
      <button id="downloadBtn" onclick="downloadImage()">Download Image</button>

    </div>

    <canvas id="canvas"></canvas>

  </div>

<script>

const imageInput = document.getElementById("imageInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const intensity = document.getElementById("intensity");
const intensityValue = document.getElementById("intensityValue");
const downloadBtn = document.getElementById("downloadBtn");

let originalImage = new Image();

const neonColors = {
  cyan: [0, 255, 255],
  pink: [255, 0, 170],
  green: [0, 255, 100],
  purple: [190, 0, 255]
};

intensity.addEventListener("input", function () {
  intensityValue.textContent = this.value;
});

imageInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function (event) {

    originalImage.onload = function () {

      canvas.width = originalImage.width;
      canvas.height = originalImage.height;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(originalImage, 0, 0);

      downloadBtn.style.display = "none";
    };

    originalImage.src = event.target.result;
  };

  reader.readAsDataURL(file);
});


function applyNeon() {

  if (!originalImage.src) {
    alert("Please upload an image first.");
    return;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.drawImage(
    originalImage,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const imageData = ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const data = imageData.data;

  const colorName = document.getElementById("colorSelect").value;
  const neon = neonColors[colorName];

  const strength = Number(intensity.value) / 100;

  for (let i = 0; i < data.length; i += 4) {

    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    const brightness =
      (0.299 * r + 0.587 * g + 0.114 * b) / 255;

    const glowAmount =
      Math.pow(brightness, 1.4) * strength;

    data[i] =
      r * (1 - glowAmount) +
      neon[0] * glowAmount;

    data[i + 1] =
      g * (1 - glowAmount) +
      neon[1] * glowAmount;

    data[i + 2] =
      b * (1 - glowAmount) +
      neon[2] * glowAmount;
  }

  ctx.putImageData(imageData, 0, 0);

  const glowCanvas = document.createElement("canvas");

  glowCanvas.width = canvas.width;
  glowCanvas.height = canvas.height;

  const glowCtx = glowCanvas.getContext("2d");

  glowCtx.drawImage(canvas, 0, 0);

  ctx.save();

  ctx.globalCompositeOperation = "screen";

  ctx.globalAlpha = 0.25 + strength * 0.35;

  ctx.filter =
    "blur(" + (4 + strength * 12) + "px) brightness(1.5)";

  ctx.drawImage(glowCanvas, 0, 0);

  ctx.restore();

  downloadBtn.style.display = "inline-block";
}


function resetImage() {

  if (!originalImage.src) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.drawImage(
    originalImage,
    0,
    0,
    canvas.width,
    canvas.height
  );

  downloadBtn.style.display = "none";
}


function downloadImage() {

  const link = document.createElement("a");

  link.download = "toolsarthi-neon-glow.png";

  link.href = canvas.toDataURL("image/png");

  link.click();
}

</script>

</body>
</html>
