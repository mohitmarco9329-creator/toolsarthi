<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Sharpen Effect - ToolSarthi</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h1{
    margin-bottom:10px;
}

p{
    color:#666;
}

input[type="file"]{
    margin:20px 0;
}

canvas{
    max-width:100%;
    margin:15px 0;
    border-radius:10px;
}

.controls{
    margin:15px 0;
}

input[type="range"]{
    width:80%;
}

button{
    padding:12px 18px;
    margin:6px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#222;
    color:white;
    font-size:15px;
}

button:hover{
    opacity:0.85;
}
</style>
</head>

<body>

<div class="container">

<h1>🔍 Image Sharpen Effect</h1>

<p>Make your photos look sharper and more detailed.</p>

<input type="file" id="upload" accept="image/*">

<div class="controls">

<label>
Sharpness:
<strong><span id="strengthValue">50</span></strong>
</label>

<br><br>

<input
    type="range"
    id="strength"
    min="10"
    max="100"
    value="50"
>

</div>

<canvas id="canvas"></canvas>

<br>

<button onclick="applySharpen()">Apply Effect</button>

<button onclick="resetImage()">Reset</button>

<button onclick="downloadImage()">Download Image</button>

</div>

<script>

const upload =
    document.getElementById("upload");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const strengthSlider =
    document.getElementById("strength");

const strengthValue =
    document.getElementById("strengthValue");

let originalImage = null;

strengthSlider.addEventListener("input", function(){

    strengthValue.textContent = this.value;

});

upload.addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    const img = new Image();

    img.onload = function(){

        originalImage = img;

        canvas.width = img.width;

        canvas.height = img.height;

        ctx.drawImage(img,0,0);

    };

    img.src = URL.createObjectURL(file);

});

function applySharpen(){

    if(!originalImage){

        alert("Please upload an image first.");

        return;
    }

    ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const source =
        imageData.data;

    const output =
        new Uint8ClampedArray(source);

    const width =
        canvas.width;

    const height =
        canvas.height;

    const amount =
        Number(strengthSlider.value) / 100;

    for(let y = 1; y < height - 1; y++){

        for(let x = 1; x < width - 1; x++){

            const center =
                (y * width + x) * 4;

            const top =
                ((y - 1) * width + x) * 4;

            const bottom =
                ((y + 1) * width + x) * 4;

            const left =
                (y * width + (x - 1)) * 4;

            const right =
                (y * width + (x + 1)) * 4;

            for(let c = 0; c < 3; c++){

                const sharpened =
                    5 * source[center + c]
                    - source[top + c]
                    - source[bottom + c]
                    - source[left + c]
                    - source[right + c];

                output[center + c] =
                    source[center + c] +
                    (sharpened - source[center + c]) * amount;

            }

            output[center + 3] = 255;

        }
    }

    const result =
        new ImageData(
            output,
            width,
            height
        );

    ctx.putImageData(result,0,0);

}

function resetImage(){

    if(!originalImage){

        alert("Please upload an image first.");

        return;
    }

    canvas.width =
        originalImage.width;

    canvas.height =
        originalImage.height;

    ctx.drawImage(
        originalImage,
        0,
        0
    );

}

function downloadImage(){

    if(!originalImage){

        alert("Please upload an image first.");

        return;
    }

    const link =
        document.createElement("a");

    link.download =
        "toolsarthi-sharpened.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();

}

</script>

</body>
  </html>
