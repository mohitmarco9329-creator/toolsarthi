<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Color Splash Effect - ToolSarthi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    input[type="file"] {
      margin: 20px 0;
      padding: 10px;
    }

    .controls {
      margin: 15px 0;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 80%;
      max-width: 450px;
    }

    #colorValue {
      font-weight: bold;
      margin-left: 8px;
    }

    canvas {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      display: none;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .apply {
      background: #222;
      color: white;
    }

    .reset {
      background: #ddd;
    }

    .download {
      background: #198754;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    .info {
      margin-top: 15px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎨 Image Color Splash Effect</h1>

    <p>
      Keep one color in your photo and turn the remaining colors into grayscale.
    </p>

    <input type="file" id="upload" accept="image/*">

    <div class="controls">
      <label>
        Select Color Hue:
        <span id="colorValue">0°</span>
      </label>

      <input
        type="range"
        id="hueSlider"
        min="0"
        max="360"
        value="0"
      >
    </div>

    <div class="controls">
      <label>
        Color Range:
        <span id="rangeValue">35°</span>
      </label>

      <input
        type="range"
        id="rangeSlider"
        min="5"
        max="100"
        value="35"
      >
    </div>

    <canvas id="canvas"></canvas>

    <div>
      <button class="apply" onclick="applySplash()">
        Apply Color Splash
      </button>

      <button class="reset" onclick="resetImage()">
        Reset
      </button>

      <button class="download" onclick="downloadImage()">
        Download Image
      </button>
    </div>

    <div class="info">
      Tip: Slider ko move karke photo me preserve karne wala color select karein.
    </div>

  </div>

  <script>
    const upload = document.getElementById("upload");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const hueSlider = document.getElementById("hueSlider");
    const rangeSlider = document.getElementById("rangeSlider");

    const colorValue = document.getElementById("colorValue");
    const rangeValue = document.getElementById("rangeValue");

    let originalImage = null;

    hueSlider.addEventListener("input", function() {
      colorValue.textContent = this.value + "°";
    });

    rangeSlider.addEventListener("input", function() {
      rangeValue.textContent = this.value + "°";
    });

    upload.addEventListener("change", function(event) {

      const file = event.target.files[0];

      if (!file) return;

      const img = new Image();

      img.onload = function() {

        originalImage = img;

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);

        canvas.style.display = "block";
      };

      img.src = URL.createObjectURL(file);
    });

    function rgbToHsl(r, g, b) {

      r /= 255;
      g /= 255;
      b /= 255;

      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);

      let h = 0;
      let s = 0;
      let l = (max + min) / 2;

      if (max !== min) {

        const d = max - min;

        s = l > 0.5
          ? d / (2 - max - min)
          : d / (max + min);

        switch (max) {

          case r:
            h = (g - b) / d + (g < b ? 6 : 0);
            break;

          case g:
            h = (b - r) / d + 2;
            break;

          case b:
            h = (r - g) / d + 4;
            break;
        }

        h /= 6;
      }

      return {
        h: h * 360,
        s: s,
        l: l
      };
    }

    function applySplash() {

      if (!originalImage) {
        alert("Please upload an image first.");
        return;
      }

      ctx.drawImage(originalImage, 0, 0);

      const imageData = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );

      const data = imageData.data;

      const targetHue = Number(hueSlider.value);
      const colorRange = Number(rangeSlider.value);

      for (let i = 0; i < data.length; i += 4) {

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        const hsl = rgbToHsl(r, g, b);

        let hueDifference = Math.abs(hsl.h - targetHue);

        if (hueDifference > 180) {
          hueDifference = 360 - hueDifference;
        }

        if (
          hueDifference > colorRange ||
          hsl.s < 0.15
        ) {

          const gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;

          data[i] = gray;
          data[i + 1] = gray;
          data[i + 2] = gray;
        }
      }

      ctx.putImageData(imageData, 0, 0);
    }

    function resetImage() {

      if (!originalImage) return;

      canvas.width = originalImage.width;
      canvas.height = originalImage.height;

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        originalImage,
        0,
        0
      );
    }

    function downloadImage() {

      if (!originalImage) {
        alert("Please upload an image first.");
        return;
      }

      const link = document.createElement("a");

      link.download = "color-splash-image.png";
      link.href = canvas.toDataURL("image/png");

      link.click();
    }
  </script>

</body>
</html>
