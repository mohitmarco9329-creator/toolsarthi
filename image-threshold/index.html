<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Threshold Effect - ToolSarthi</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h1{
    margin-bottom:10px;
}

p{
    color:#666;
}

input[type="file"]{
    margin:20px 0;
}

canvas{
    max-width:100%;
    margin:15px 0;
    border-radius:10px;
    background:white;
}

.controls{
    margin:15px 0;
}

input[type="range"]{
    width:80%;
}

button{
    padding:12px 18px;
    margin:6px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#222;
    color:white;
    font-size:15px;
}

button:hover{
    opacity:0.85;
}
</style>
</head>

<body>

<div class="container">

<h1>⚫ Image Threshold Effect</h1>

<p>Convert your photos into pure black and white stencil-style images.</p>

<input type="file" id="upload" accept="image/*">

<div class="controls">

<label>
Threshold:
<strong><span id="thresholdValue">128</span></strong>
</label>

<br><br>

<input
    type="range"
    id="threshold"
    min="30"
    max="220"
    value="128"
>

</div>

<canvas id="canvas"></canvas>

<br>

<button onclick="applyThreshold()">Apply Effect</button>

<button onclick="resetImage()">Reset</button>

<button onclick="downloadImage()">Download Image</button>

</div>

<script>

const upload = document.getElementById("upload");

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

const thresholdSlider =
    document.getElementById("threshold");

const thresholdValue =
    document.getElementById("thresholdValue");

let originalImage = null;

thresholdSlider.addEventListener("input", function(){

    thresholdValue.textContent = this.value;

});

upload.addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    const img = new Image();

    img.onload = function(){

        originalImage = img;

        canvas.width = img.width;

        canvas.height = img.height;

        ctx.drawImage(img,0,0);

    };

    img.src = URL.createObjectURL(file);

});

function applyThreshold(){

    if(!originalImage){

        alert("Please upload an image first.");

        return;
    }

    ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data = imageData.data;

    const threshold =
        Number(thresholdSlider.value);

    for(let i = 0; i < data.length; i += 4){

        const r = data[i];

        const g = data[i + 1];

        const b = data[i + 2];

        const gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;

        const value =
            gray >= threshold ? 255 : 0;

        data[i] = value;

        data[i + 1] = value;

        data[i + 2] = value;

    }

    ctx.putImageData(imageData,0,0);

}

function resetImage(){

    if(!originalImage){

        alert("Please upload an image first.");

        return;
    }

    canvas.width = originalImage.width;

    canvas.height = originalImage.height;

    ctx.drawImage(
        originalImage,
        0,
        0
    );

}

function downloadImage(){

    if(!originalImage){

        alert("Please upload an image first.");

        return;
    }

    const link =
        document.createElement("a");

    link.download =
        "toolsarthi-threshold.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();

}

</script>

</body>
</html>
