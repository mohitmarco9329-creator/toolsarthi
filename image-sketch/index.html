<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Sketch Effect - ToolSarthi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    input[type="file"] {
      margin: 20px 0;
    }

    .controls {
      margin: 15px 0;
    }

    input[type="range"],
    button {
      margin: 8px;
    }

    input[type="range"] {
      width: 180px;
    }

    button {
      padding: 11px 18px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    canvas {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 10px;
    }

    #downloadBtn {
      display: none;
      background: #0a7cff;
    }

    .value {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>✏️ Image Sketch Effect</h1>
    <p>Turn your photos into pencil-style sketch images.</p>

    <input type="file" id="imageInput" accept="image/*">

    <div class="controls">

      <label>
        Sketch Strength:
        <input
          type="range"
          id="strength"
          min="20"
          max="100"
          value="70"
        >
        <span class="value" id="strengthValue">70</span>
      </label>

      <br>

      <button onclick="applySketch()">Apply Sketch</button>
      <button onclick="resetImage()">Reset</button>
      <button id="downloadBtn" onclick="downloadImage()">Download Image</button>

    </div>

    <canvas id="canvas"></canvas>

  </div>

<script>

const imageInput = document.getElementById("imageInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const strength = document.getElementById("strength");
const strengthValue = document.getElementById("strengthValue");
const downloadBtn = document.getElementById("downloadBtn");

let originalImage = new Image();

strength.addEventListener("input", function () {
  strengthValue.textContent = this.value;
});


imageInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function (event) {

    originalImage.onload = function () {

      canvas.width = originalImage.width;
      canvas.height = originalImage.height;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
      );

      downloadBtn.style.display = "none";
    };

    originalImage.src = event.target.result;
  };

  reader.readAsDataURL(file);
});


function applySketch() {

  if (!originalImage.src) {
    alert("Please upload an image first.");
    return;
  }

  ctx.drawImage(
    originalImage,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const imageData = ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const data = imageData.data;

  const amount = Number(strength.value) / 100;

  for (let i = 0; i < data.length; i += 4) {

    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    const gray =
      0.299 * r +
      0.587 * g +
      0.114 * b;

    const contrast =
      (gray - 128) * (1 + amount * 1.5) + 128;

    const value = Math.max(
      0,
      Math.min(255, contrast)
    );

    data[i] = value;
    data[i + 1] = value;
    data[i + 2] = value;
  }

  ctx.putImageData(imageData, 0, 0);

  downloadBtn.style.display = "inline-block";
}


function resetImage() {

  if (!originalImage.src) return;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.drawImage(
    originalImage,
    0,
    0,
    canvas.width,
    canvas.height
  );

  downloadBtn.style.display = "none";
}


function downloadImage() {

  const link = document.createElement("a");

  link.download = "toolsarthi-sketch.png";

  link.href = canvas.toDataURL("image/png");

  link.click();
}

</script>

</body>
</html>
