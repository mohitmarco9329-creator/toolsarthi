<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Gradient Map Effect - ToolSarthi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    input[type="file"] {
      margin: 20px 0;
      padding: 10px;
    }

    .control {
      margin: 18px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select {
      padding: 10px;
      border-radius: 7px;
      border: 1px solid #ccc;
      font-size: 15px;
      width: 220px;
    }

    input[type="range"] {
      width: 80%;
      max-width: 450px;
    }

    .value {
      font-weight: bold;
      margin-left: 8px;
    }

    canvas {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      display: none;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .apply {
      background: #222;
      color: white;
    }

    .reset {
      background: #ddd;
    }

    .download {
      background: #198754;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    .info {
      margin-top: 15px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌈 Image Gradient Map Effect</h1>

    <p>
      Apply creative color gradients to the dark and bright areas of your photos.
    </p>

    <input type="file" id="upload" accept="image/*">

    <div class="control">

      <label>Choose Gradient:</label>

      <select id="gradientSelect">

        <option value="sunset">
          Sunset
        </option>

        <option value="ocean">
          Ocean
        </option>

        <option value="purple">
          Purple Dream
        </option>

        <option value="fire">
          Fire
        </option>

        <option value="mint">
          Mint
        </option>

        <option value="mono">
          Black & White
        </option>

      </select>

    </div>

    <div class="control">

      <label>
        Effect Strength:
        <span class="value" id="strengthValue">100%</span>
      </label>

      <input
        type="range"
        id="strengthSlider"
        min="0"
        max="100"
        value="100"
      >

    </div>

    <canvas id="canvas"></canvas>

    <div>

      <button class="apply" onclick="applyGradient()">
        Apply Gradient Map
      </button>

      <button class="reset" onclick="resetImage()">
        Reset
      </button>

      <button class="download" onclick="downloadImage()">
        Download Image
      </button>

    </div>

    <div class="info">
      Tip: Different gradients try karke cinematic effects create karein.
    </div>

  </div>

  <script>

    const upload = document.getElementById("upload");

    const canvas = document.getElementById("canvas");

    const ctx = canvas.getContext("2d");

    const gradientSelect =
      document.getElementById("gradientSelect");

    const strengthSlider =
      document.getElementById("strengthSlider");

    const strengthValue =
      document.getElementById("strengthValue");

    let originalImage = null;


    strengthSlider.addEventListener("input", function() {

      strengthValue.textContent =
        this.value + "%";

    });


    upload.addEventListener("change", function(event) {

      const file = event.target.files[0];

      if (!file) return;

      const img = new Image();

      img.onload = function() {

        originalImage = img;

        canvas.width = img.width;

        canvas.height = img.height;

        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        ctx.drawImage(
          img,
          0,
          0
        );

        canvas.style.display = "block";

      };

      img.src = URL.createObjectURL(file);

    });


    const gradients = {

      sunset: {
        dark: [25, 5, 50],
        light: [255, 170, 60]
      },

      ocean: {
        dark: [5, 20, 70],
        light: [70, 220, 240]
      },

      purple: {
        dark: [35, 5, 60],
        light: [255, 100, 220]
      },

      fire: {
        dark: [40, 5, 5],
        light: [255, 220, 40]
      },

      mint: {
        dark: [5, 40, 35],
        light: [180, 255, 210]
      },

      mono: {
        dark: [0, 0, 0],
        light: [255, 255, 255]
      }

    };


    function applyGradient() {

      if (!originalImage) {

        alert("Please upload an image first.");

        return;

      }

      ctx.drawImage(
        originalImage,
        0,
        0
      );

      const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

      const data =
        imageData.data;

      const selected =
        gradients[gradientSelect.value];

      const strength =
        Number(strengthSlider.value) / 100;


      for (
        let i = 0;
        i < data.length;
        i += 4
      ) {

        const r = data[i];

        const g = data[i + 1];

        const b = data[i + 2];

        const gray =
          (
            0.299 * r +
            0.587 * g +
            0.114 * b
          ) / 255;


        const mappedR =
          selected.dark[0] +
          (
            selected.light[0] -
            selected.dark[0]
          ) * gray;

        const mappedG =
          selected.dark[1] +
          (
            selected.light[1] -
            selected.dark[1]
          ) * gray;

        const mappedB =
          selected.dark[2] +
          (
            selected.light[2] -
            selected.dark[2]
          ) * gray;


        data[i] =
          r * (1 - strength) +
          mappedR * strength;

        data[i + 1] =
          g * (1 - strength) +
          mappedG * strength;

        data[i + 2] =
          b * (1 - strength) +
          mappedB * strength;

      }


      ctx.putImageData(
        imageData,
        0,
        0
      );

    }


    function resetImage() {

      if (!originalImage) return;

      canvas.width =
        originalImage.width;

      canvas.height =
        originalImage.height;

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        originalImage,
        0,
        0
      );

    }


    function downloadImage() {

      if (!originalImage) {

        alert("Please upload an image first.");

        return;

      }

      const link =
        document.createElement("a");

      link.download =
        "gradient-map-image.png";

      link.href =
        canvas.toDataURL("image/png");

      link.click();

    }

  </script>

</body>
  </html>
