<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Cropper - ToolSarthi</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      color: #222;
    }

    p {
      color: #666;
    }

    input {
      margin: 20px 0;
    }

    canvas {
      max-width: 100%;
      border: 1px solid #ddd;
      margin-top: 15px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }

    #downloadBtn {
      display: none;
      background: #16a34a;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Image Cropper</h1>
    <p>Crop your images quickly and easily.</p>

    <input type="file" id="imageInput" accept="image/*">

    <br>

    <canvas id="canvas"></canvas>

    <br>

    <button id="cropBtn">Crop Image</button>

    <br>

    <a id="downloadBtn" download="cropped-image.png">
      <button>Download Cropped Image</button>
    </a>

  </div>

  <script>
    const imageInput = document.getElementById("imageInput");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const cropBtn = document.getElementById("cropBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    let image = new Image();

    imageInput.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (e) {
        image.onload = function () {
          canvas.width = image.width;
          canvas.height = image.height;
          ctx.drawImage(image, 0, 0);
        };

        image.src = e.target.result;
      };

      reader.readAsDataURL(file);
    });

    cropBtn.addEventListener("click", function () {
      if (!image.src) {
        alert("Please select an image first.");
        return;
      }

      const size = Math.min(image.width, image.height);

      const startX = (image.width - size) / 2;
      const startY = (image.height - size) / 2;

      canvas.width = size;
      canvas.height = size;

      ctx.drawImage(
        image,
        startX,
        startY,
        size,
        size,
        0,
        0,
        size,
        size
      );

      downloadBtn.href = canvas.toDataURL("image/png");
      downloadBtn.style.display = "inline-block";
    });
  </script>

</body>
</html>
